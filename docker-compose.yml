version: '3.8'
services:
  backend:
    build: ./backend
    volumes:
      - /var/www/uploads:/tmphoto_app/resources/static/assets/uploads
    ports:
      - '3000:3000'
    environment:
      DB_HOST: mysqldb
      DB_USER: tatiana
      DB_PASSWORD: /run/secrets/db_password
      DB_NAME: tanyamartelliphotography
      JWT_SECRET_KEY: /run/secrets/jwt_secret_key
      BASE_URL: https://www.tanyamartelli.com
      EMAIL_ENABLED: 'true'
      RESEND_API_KEY: /run/secrets/resend_api_key
      RESEND_FROM_EMAIL: notificaciones@tanyamartelli.com
      RESEND_FROM_NAME: 'Tanya Martelli Photography'
      EMAIL_USER: tanyamartelliphoto@gmail.com
      EMAIL_SM: santimartelli@gmail.com
      TELEGRAM_BOT_TOKEN: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: '237241878'
    depends_on:
      - mysqldb
    secrets:
      - db_password
      - jwt_secret_key
      - resend_api_key
      - telegram_bot_token

  frontend:
    image: nginx:stable-alpine
    volumes:
      - /var/www/certificates:/var/www/certificates
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www/uploads:/var/www/uploads
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend

  mysqldb:
    image: mysql:5.7
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: N2ZaS&t8e^
      MYSQL_DATABASE: tanyamartelliphotography
    volumes:
      - db-data:/var/lib/mysql
      - ./tanyamartelliphotography.sql:/docker-entrypoint-initdb.d/tanyamartelliphotography.sql
      # - ./custom-my.cnf:/etc/mysql/conf.d/custom-my.cnf:ro
      # - /var/log/mysql:/var/log/mysql

volumes:
  db-data:
  uploads-volume:
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  resend_api_key:
    file: ./secrets/resend_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
